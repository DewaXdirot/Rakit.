<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Dayung Sungai</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <div id="overlay">
      <h1 id="ovTitle">Dayung Sungai</h1>
      <p id="ovText">Susuri sungai dengan rakit. Tekan <b>DAYUNG</b> (atau Spasi) untuk maju & menusuk boss dengan tombak, gerakkan <b>analog</b> (atau panah / WASD) untuk belok. Ambil <b>peti P3K</b> (HP penuh) dan <b>loot</b> boss. Bunuh ikan/boss dengan tombak untuk lifesteal +45% HP. Pilih slot untuk mulai / melanjutkan.</p>
      <div id="slots"></div>
    </div>

    <button id="mute" aria-label="Suara">🔊</button>
    <button id="saveQuit" aria-label="Simpan dan keluar">💾 Simpan & Keluar</button>
    <div id="stick"><div id="knob"></div></div>
    <button id="dayung">DAYUNG</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
